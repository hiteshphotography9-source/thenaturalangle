<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap');

  :root{
    --canopy:#152318;
    --canopy-2:#1d3023;
    --parchment:#F1ECDC;
    --ink:#1D1A13;
    --amber:#D6992C;
    --moss:#5C6B47;
    --line: rgba(241,236,220,0.14);
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html{scroll-behavior:smooth;}

  body{
    font-family:'Work Sans', sans-serif;
    background:var(--parchment);
    color:var(--ink);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }

  h1,h2,h3{
    font-family:'Fraunces', serif;
    font-weight:600;
    line-height:1.08;
    letter-spacing:-0.01em;
  }

  a{color:inherit;}

  img{max-width:100%; display:block;}

  .wrap{
    max-width:1100px;
    margin:0 auto;
    padding:0 28px;
  }

  /* ---------- FOLLOW HERO ---------- */

  .follow-hero{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background: radial-gradient(120% 140% at 78% -10%, var(--canopy-2) 0%, var(--canopy) 55%, #0F1912 100%);
    color:var(--parchment);
    padding:64px 0 96px;
  }

  .brand-row{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    row-gap:14px;
    gap:10px;
    font-size:14px;
    letter-spacing:0.02em;
    color:rgba(241,236,220,0.72);
  }

  .brand-row .brand-link{
    display:flex;
    align-items:center;
    gap:10px;
    color:inherit;
    text-decoration:none;
    transition:opacity 0.15s ease;
  }
  .brand-row .brand-link:hover{ opacity:0.8; }

  .brand-row .mark{
    width:22px; height:22px;
    border-radius:50%;
    border:1.5px solid var(--amber);
    position:relative;
    flex:none;
  }
  .brand-row .mark::before{
    content:"";
    position:absolute; inset:5px;
    border-radius:50%;
    background:var(--amber);
  }

  .follow-center{
    text-align:center;
    max-width:640px;
    margin:0 auto;
    padding-top:56px;
  }

  .kicker{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:19px;
    color:var(--amber);
    margin-bottom:14px;
  }

  .follow-center h1{
    font-size:clamp(38px, 5vw, 58px);
    color:var(--parchment);
  }

  .follow-center h1 em{
    font-style:italic;
    color:var(--amber);
  }

  .follow-center .sub{
    margin-top:22px;
    font-size:18px;
    max-width:46ch;
    margin-left:auto;
    margin-right:auto;
    color:rgba(241,236,220,0.82);
  }

  /* ---------- PLATFORM CARDS ---------- */

  .cards{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:22px;
    margin-top:52px;
  }

  .card{
    position:relative;
    display:block;
    border-radius:6px;
    overflow:hidden;
    aspect-ratio:3/4;
    text-decoration:none;
    color:var(--parchment);
    border:1px solid rgba(241,236,220,0.14);
    transition:transform 0.2s ease, box-shadow 0.2s ease;
  }
  .card:hover{
    transform:translateY(-4px);
    box-shadow:0 16px 32px rgba(0,0,0,0.35);
  }

  .card img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:transform 0.4s ease;
  }
  .card:hover img{ transform:scale(1.05); }

  .card::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(180deg, rgba(15,25,18,0) 42%, rgba(10,16,11,0.88) 100%);
    pointer-events:none;
  }

  .card-label{
    position:absolute;
    left:0; right:0; bottom:0;
    padding:20px 18px;
    z-index:2;
    text-align:left;
  }

  .card-platform{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:22px;
    color:var(--parchment);
  }

  .card-cta{
    margin-top:4px;
    font-size:13px;
    letter-spacing:0.02em;
    color:var(--amber);
    font-weight:600;
  }

  /* ---------- NAV LINKS BELOW CARDS ---------- */

  .follow-nav{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:16px;
    margin-top:48px;
  }

  .cta{
    display:inline-block;
    background:var(--amber);
    color:var(--ink);
    font-weight:600;
    font-size:16px;
    padding:16px 30px;
    border-radius:3px;
    text-decoration:none;
    transition:transform 0.15s ease, background 0.15s ease;
  }
  .cta:hover{ background:#e5aa3d; transform:translateY(-1px); }

  .cta-secondary{
    display:inline-block;
    background:transparent;
    color:var(--parchment);
    font-weight:600;
    font-size:16px;
    padding:14.5px 28px;
    border-radius:3px;
    border:1.5px solid rgba(241,236,220,0.4);
    text-decoration:none;
    transition:transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
  }
  .cta-secondary:hover{
    border-color:var(--amber);
    background:rgba(214,153,44,0.08);
    transform:translateY(-1px);
  }

  footer{
    padding:28px 0 40px;
    text-align:center;
    font-size:13px;
    color:#8a836c;
    background:var(--parchment);
  }

  @media (max-width: 780px){
    .cards{ grid-template-columns:1fr; }
    .card{ aspect-ratio:16/10; }
    .follow-hero{ padding:40px 0 64px; }
    .follow-center{ padding-top:40px; }
  }
</style>
</head>
