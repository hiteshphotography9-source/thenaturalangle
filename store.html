<style>

  :root{
    --canopy:#152318;
    --canopy-2:#1d3023;
    --parchment:#F1ECDC;
    --ink:#1D1A13;
    --amber:#D6992C;
    --moss:#5C6B47;
    --line: rgba(241,236,220,0.14);
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html{scroll-behavior:smooth;}

  body{
    font-family:'Work Sans', sans-serif;
    background:var(--parchment);
    color:var(--ink);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }

  h1,h2,h3{
    font-family:'Fraunces', serif;
    font-weight:600;
    line-height:1.08;
    letter-spacing:-0.01em;
  }

  a{color:inherit;}

  img{max-width:100%; display:block;}

  .wrap{
    max-width:1100px;
    margin:0 auto;
    padding:0 28px;
  }

  /* ---------- STORE HERO ---------- */

  .store-hero{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background: radial-gradient(120% 140% at 78% -10%, var(--canopy-2) 0%, var(--canopy) 55%, #0F1912 100%);
    color:var(--parchment);
    padding:64px 0 96px;
  }

  .brand-row{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    row-gap:14px;
    gap:10px;
    font-size:14px;
    letter-spacing:0.02em;
    color:rgba(241,236,220,0.72);
  }

  .brand-row .brand-link{
    display:flex;
    align-items:center;
    gap:10px;
    color:inherit;
    text-decoration:none;
    transition:opacity 0.15s ease;
  }
  .brand-row .brand-link:hover{ opacity:0.8; }

  .brand-row .mark{
    width:22px; height:22px;
    border-radius:50%;
    border:1.5px solid var(--amber);
    position:relative;
    flex:none;
  }
  .brand-row .mark::before{
    content:"";
    position:absolute; inset:5px;
    border-radius:50%;
    background:var(--amber);
  }

  .brand-row .nav-cta{
    margin-left:auto;
    display:inline-block;
    background:var(--amber);
    color:var(--ink);
    font-weight:600;
    font-size:15px;
    letter-spacing:0.01em;
    padding:13px 24px;
    border-radius:3px;
    text-decoration:none;
    white-space:nowrap;
    transition:transform 0.15s ease, background 0.15s ease;
  }
  .brand-row .nav-cta:hover{ background:#e5aa3d; transform:translateY(-1px); }

  .store-center{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    max-width:640px;
    margin:0 auto;
    padding-top:56px;
  }

  .kicker{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:19px;
    color:var(--amber);
    margin-bottom:14px;
  }

  .store-center h1{
    font-size:clamp(38px, 5vw, 58px);
    color:var(--parchment);
  }

  .store-center h1 em{
    font-style:italic;
    color:var(--amber);
  }

  .store-center .sub{
    margin-top:22px;
    font-size:18px;
    max-width:46ch;
    color:rgba(241,236,220,0.82);
  }

  .cta{
    display:inline-block;
    margin-top:34px;
    background:var(--amber);
    color:var(--ink);
    font-weight:600;
    font-size:16px;
    padding:16px 30px;
    border-radius:3px;
    text-decoration:none;
    transition:transform 0.15s ease, background 0.15s ease;
  }
  .cta:hover{ background:#e5aa3d; transform:translateY(-1px); }

  .cta-note{
    margin-top:14px;
    font-size:13px;
    color:rgba(241,236,220,0.55);
  }

  footer{
    padding:28px 0 40px;
    text-align:center;
    font-size:13px;
    color:#8a836c;
    background:var(--parchment);
  }

  @media (max-width: 860px){
    .store-hero{ padding:40px 0 64px; }
