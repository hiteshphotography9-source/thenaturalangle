<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E0F0D">
<title>Safari Toolkit · The Natural Angle</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&family=DM+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0C0A}
a{color:#C9A45C;text-decoration:none}a:hover{color:#E2C68C}
.s{width:390px;min-height:844px;background:#0E0F0D;color:#EDE8DF;font-family:Barlow,'Helvetica Neue',Helvetica,sans-serif;font-size:15px;line-height:1.45;display:flex;flex-direction:column;position:relative;overflow:hidden;-webkit-font-smoothing:antialiased}
.s *{box-sizing:border-box}
.k{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#A9A498;margin:0}
.kg{color:#C9A45C}
.d1{font-family:Newsreader,Georgia,serif;font-weight:400;font-size:36px;line-height:1.04;letter-spacing:-.015em;margin:0}
.d3{font-family:Newsreader,Georgia,serif;font-weight:400;font-size:22px;line-height:1.2;margin:0}
.sm{font-size:13px;line-height:1.45}
.mut{color:#A9A498}
.m{font-family:'DM Mono',ui-monospace,monospace;font-size:12px;letter-spacing:.02em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:0;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;text-decoration:none;white-space:nowrap}
.bp{background:#C9A45C;color:#15120B}.bp:hover{background:#D6B46E;color:#15120B}
.bs{background:transparent;color:#EDE8DF;box-shadow:inset 0 0 0 1px #3C4039}.bs:hover{color:#EDE8DF;box-shadow:inset 0 0 0 1px #6B6F66}
.bd{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:6px;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.bdl{background:transparent;box-shadow:inset 0 0 0 1px #3C4039;color:#A9A498}
.bdf{background:#2F4A3A;color:#D4E6D8}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;border:0;font-family:Barlow,sans-serif;font-size:13px;font-weight:500;color:#D8D2C6;background:#181A16;box-shadow:inset 0 0 0 1px #2C302A;white-space:nowrap;cursor:pointer;flex:none}
.chip.on{background:#EDE8DF;color:#0E0F0D;box-shadow:none}
.sec{padding:0 20px;display:flex;flex-direction:column;gap:14px}
.ib{width:44px;height:44px;flex:none;border-radius:999px;border:0;display:inline-flex;align-items:center;justify-content:center;background:#161815;color:#EDE8DF;cursor:pointer}
.ib:hover{color:#EDE8DF;background:#1F221E}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sun{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:#23261F;border-radius:14px;overflow:hidden}
.sun>div{background:#141613;padding:12px;display:flex;flex-direction:column;gap:3px}
.sun b{font-family:'DM Mono',monospace;font-weight:500;font-size:15px;color:#EDE8DF}
.pgw{height:4px;border-radius:4px;background:#2C302A;overflow:hidden}
.pgw i{display:block;height:4px;border-radius:4px;background:#6E9A7C;transition:width .3s}
.grp{display:flex;flex-direction:column;background:#161815;border-radius:16px;padding:6px 16px;box-shadow:inset 0 0 0 1px #23261F}
.row{display:flex;align-items:center;gap:14px;min-height:54px;width:100%;border:0;background:none;color:#EDE8DF;font:inherit;font-size:15px;text-align:left;cursor:pointer;padding:0;border-bottom:1px solid #1F221D}
.row:last-child{border-bottom:0}
.row .bx{flex:none;width:24px;height:24px;border-radius:7px;box-shadow:inset 0 0 0 1.5px #5B5F56;display:flex;align-items:center;justify-content:center;transition:background .2s}
.row .bx svg{width:15px;height:15px;fill:none;stroke:#0E0F0D;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset .24s ease-out}
.row.on .bx{background:#6E9A7C;box-shadow:none}
.row.on .bx svg{stroke-dashoffset:0}
.row.on .lbl{color:#8E8A80;text-decoration:line-through;text-decoration-color:#5B5F56}
.nav{margin-top:auto;position:sticky;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px 6px 30px;background:rgba(11,12,10,.97);border-top:1px solid #20231E}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:54px;color:#85817A;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:11px;letter-spacing:.16em}
.nav a:hover{color:#EDE8DF}
.nav a.on{color:#EDE8DF}.nav a.on .ic{stroke:#C9A45C}
</style>
<style>
html,body{background:#0B0C0A}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
.s{width:100% !important;max-width:480px;margin:0 auto;min-height:100vh !important}
.nav{padding-bottom:calc(8px + env(safe-area-inset-bottom)) !important}
button[aria-label^="Search"],button[aria-label="Settings"]{display:none !important}
a,button{touch-action:manipulation}
</style>
<link rel="stylesheet" href="site.css?v=4">
</head>
<body>
<template id="tpl">
<div class="s" style="width: 390px; min-height: 2400px; gap: 24px">
<div style="padding: 26px 20px 0; display: flex; justify-content: space-between; align-items: center">
<a class="ib" href="Learn.html" aria-label="Back"><svg class="ic" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></a>
<span class="bd bdf"><svg viewBox="0 0 24 24" style="width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>Works offline</span>
</div>
<div class="sec" style="gap: 8px">
<div style="display: flex; gap: 10px; align-items: center"><span class="k kg">Safari Toolkit</span></div>
<h1 class="d1">Ready before the gate opens.</h1>
</div>

<section class="sec" style="gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><span class="k kg">Field checklists</span><span class="m mut">WAIT. WATCH. SHOOT.</span></div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3"><button type="button" class="chip {{t.cls}}" style="justify-content: center" onClick="{{t.pick}}">{{t.label}}</button></sc-for>
</div>
<span class="sm mut">{{fsub}}</span>
<div class="grp">
<sc-for list="{{fitems}}" as="it" hint-placeholder-count="6">
<button type="button" class="row {{it.cls}}" onClick="{{it.toggle}}" aria-pressed="{{it.pressed}}">
<span class="bx"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>
<span class="lbl">{{it.label}}</span>
</button>
</sc-for>
</div>
</section>

<section class="sec">
<div style="display: flex; justify-content: space-between; align-items: baseline"><span class="k kg">Your kit</span><span class="m mut">{{doneCount}} OF {{total}} READY</span></div>
<div class="pgw"><i style="width: {{pct}}"></i></div>
</section>

<sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
<section class="sec" style="gap: 10px">
<span class="k">{{g.name}}</span>
<div class="grp">
<sc-for list="{{g.items}}" as="it" hint-placeholder-count="3">
<button type="button" class="row {{it.cls}}" onClick="{{it.toggle}}" aria-pressed="{{it.pressed}}">
<span class="bx"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>
<span class="lbl">{{it.label}}</span>
</button>
</sc-for>
</div>
</section>
</sc-for>

<section class="sec">
<p class="sm mut" style="margin: 0; text-align: center">Your ticks are saved on this phone automatically.</p>
<button class="btn bs" type="button" onClick="{{reset}}">Reset for next safari</button>
</section>

<div style="height: 8px"></div>
<nav class="nav" aria-label="Main">
<a href="Home.html"><svg class="ic" viewBox="0 0 24 24"><path d="M3.5 10.5 12 3.5l8.5 7V20.5h-5.5v-6h-6v6H3.5z"/></svg>HOME</a>
<a href="Watch.html"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10.5 9.5v5l4-2.5z"/></svg>WATCH</a>
<a href="Learn.html" class="on" aria-current="page"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 8.2l3.3 1.9v3.8L12 15.8l-3.3-1.9v-3.8z"/></svg>LEARN</a>
<a href="Tours.html"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg>TOURS</a>
<a href="Shop.html"><svg class="ic" viewBox="0 0 24 24"><path d="M5 8h14l-1.2 12.5H6.2z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>SHOP</a>
</nav>
</div>
</template>
<div id="app"></div>
<script src="dc-lite.js?v=1.0.0"></script>
<script>

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: 'wait', fdone: {}, done: {} };
  }
  renderVals() {
    const data = [
      { name: 'Gear', items: [['body', 'Camera body'], ['lens', 'Telephoto lens, caps off'], ['bag', 'Beanbag, filled'], ['rain', 'Rain cover'], ['clean', 'Blower + lens cloth']] },
      { name: 'Battery + memory', items: [['bat', '2 spare batteries, charged'], ['fmt', 'Cards formatted in camera'], ['spare', 'Spare card in a pocket']] },
      { name: 'Clothing', items: [['muted', 'Muted colours, nothing white'], ['layers', 'Layers for the 6 a.m. cold'], ['dust', 'Scarf for dust']] },
      { name: 'Camera settings', items: [['af', 'Servo AF + animal detection on'], ['iso', 'Manual + Auto ISO, cap set'], ['burst', 'Burst mode on']] }
    ];
    const F = {
      wait: { sub: 'Run it before every sighting.', items: ['Engine off once you are in position', 'Gear sorted before you are in range', 'Stand ahead of the path, not behind it', 'Skip the spot where every vehicle parks', 'Arrive, then stop moving', 'No shuffling. No test frames.'] },
      watch: { sub: 'Read it before you raise the camera.', items: ['Two minutes watching, no camera', 'Ears, tail and gaze read', 'Pre-flight crouch? Track now', 'Listen for langur and deer alarm calls', 'Heard a call? Stop and wait it out', 'Bouncing or bunching means a threat', 'Scan for the predator the prey is watching'] },
      shoot: { sub: 'Run it the moment the action starts.', items: ['Single-point AF, right on the eye', 'Back-button focus. No re-hunting.', 'One bright patch? Meter for it', 'Even light? Read the whole frame', 'Burst the instant the behaviour starts', 'Keep shooting after the hero frame'] }
    };
    const mode = this.state.mode, fdone = this.state.fdone;
    const tabs = [['wait', 'WAIT'], ['watch', 'WATCH'], ['shoot', 'SHOOT']].map(([k, label]) => ({ label, cls: k === mode ? 'on' : '', pick: () => this.setState({ mode: k }) }));
    const fitems = F[mode].items.map((label, i) => { const id = mode + i; const on = !!fdone[id]; return { label, cls: on ? 'on' : '', pressed: on ? 'true' : 'false', toggle: () => this.setState({ fdone: Object.assign({}, fdone, { [id]: !on }) }) }; });
    const done = this.state.done;
    let total = 0, doneCount = 0;
    const groups = data.map((g) => ({
      name: g.name,
      items: g.items.map(([id, label]) => {
        total++;
        const on = !!done[id];
        if (on) doneCount++;
        return {
          label, cls: on ? 'on' : '', pressed: on ? 'true' : 'false',
          toggle: () => this.setState({ done: Object.assign({}, done, { [id]: !on }) })
        };
      })
    }));
    return {
      tabs, fitems, fsub: F[mode].sub,
      groups, total, doneCount,
      pct: Math.round((doneCount / total) * 100) + '%',
      reset: () => this.setState({ done: {}, fdone: {} })
    };
  }
}

DC.mount(Component, {}, "tna_toolkit");
</script>
<script src="app.js?v=1.0.0"></script>
<script src="site.js" defer></script>
</body>
</html>
